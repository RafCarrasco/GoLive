name: Rust desktop (experimental)
# Experimento do app desktop em Rust (desktop/rust). Não gera instalador nem release:
# o app que o pessoal usa continua sendo o Electron (windows.yml).
on:
  pull_request:
    paths: ['desktop/rust/**', 'desktop/rust-media/**', 'desktop/rust-audio/**', 'desktop/rust-native/**', 'desktop/rust-app/**', '.github/workflows/rust-desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/rust/**', 'desktop/rust-media/**', 'desktop/rust-audio/**', 'desktop/rust-native/**', 'desktop/rust-app/**', '.github/workflows/rust-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rust-toolchain.toml fixa a versão; isto só instala o que ele pede.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: nimbo-rust-diagnostic
          path: desktop/rust/target/release/nimbo-desktop.exe
          if-no-files-found: error
          retention-days: 7
  crates:
    # Motor de mídia, áudio do jogo e lista de janelas/vigia do jogo. Medir captura precisa de tela e
    # som, então aqui só compila, passa lint e roda os testes que não dependem disso.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [rust-media, rust-audio, rust-native]
    defaults:
      run:
        shell: pwsh
        working-directory: desktop/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/${{ matrix.crate }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
