name: Community validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - name: Desktop (Electron) contract tests
        run: npm run test:desktop
      - name: Rules are generated from scripts/build-rules.mjs
        run: npm run rules:build && git diff --exit-code database.rules.json
      - name: Security rules tests (emulator)
        run: npm install -g firebase-tools@15 && npm run test:rules
