name: Community validation
on:
  push:
    branches: ['feat/community-foundation', 'feat/private-community-live-experience']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Validate Firebase rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
