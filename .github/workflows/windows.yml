name: Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Generate Windows application icon
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image, ImageDraw
          im=Image.new('RGBA',(256,256),(11,16,32,255))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((18,18,238,238),radius=55,fill=(102,91,244,255))
          d.rounded_rectangle((62,75,194,181),radius=22,fill=(234,239,255,255))
          d.polygon([(119,93),(119,164),(169,129)],fill=(102,91,244,255))
          im.save('desktop/icon.ico',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - run: npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: GoLive-Windows-Portable
          path: release/GoLive-Portable.exe
          if-no-files-found: error
