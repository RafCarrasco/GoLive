name: Windows portable
# Só manual: gera o executável como artifact. Releases não são publicadas automaticamente.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: Nimbo-Windows-Setup
          path: |
            release/Nimbo-Setup.exe
            release/Nimbo-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

