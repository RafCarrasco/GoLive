[package]
name = "nimbo-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "Nimbo desktop shell in Rust (Tauri 2): the site inside WebView2 plus the native bridge. Experimental."

[build-dependencies]
tauri-build = "2"

[dependencies]
# custom-protocol: build de produção sem o tauri-cli (sem ele o Tauri se comporta como "dev").
# dynamic-acl: a permissão da ponte é criada na partida, porque a origem muda com NIMBO_URL.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "custom-protocol", "dynamic-acl"] }
# Segunda abertura do app só traz a primeira janela para a frente.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Código de uso único do login.
getrandom = "0.3"
# Abre links no navegador padrão pelo ShellExecute (sem a feature, a crate chama o PowerShell).
open = { version = "5", features = ["shellexecute-on-windows"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
