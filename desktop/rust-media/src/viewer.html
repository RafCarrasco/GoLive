<!doctype html>
<meta charset="utf-8" />
<title>Nimbo Rust: teste de envio</title>
<body style="margin:0;background:#111;color:#ddd;font:14px system-ui">
  <video id="v" autoplay muted playsinline style="width:100vw;max-height:90vh;background:#000"></video>
  <pre id="s" style="margin:8px">conectando...</pre>
  <script>
    (async () => {
      const pc = new RTCPeerConnection();
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.ontrack = (e) => (document.getElementById('v').srcObject = new MediaStream([e.track]));
      await pc.setLocalDescription();
      await new Promise((r) =>
        pc.iceGatheringState === 'complete'
          ? r()
          : (pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r()),
      );
      const res = await fetch('/offer', { method: 'POST', body: JSON.stringify(pc.localDescription) });
      await pc.setRemoteDescription(await res.json());
      setInterval(async () => {
        let o = { estado: pc.connectionState };
        (await pc.getStats()).forEach((r) => {
          if (r.type === 'inbound-rtp' && r.kind === 'video')
            o = {
              estado: pc.connectionState,
              quadros: r.framesDecoded,
              fps: r.framesPerSecond,
              tamanho: r.frameWidth + 'x' + r.frameHeight,
              decodificador: r.decoderImplementation,
              kb: Math.round(r.bytesReceived / 1024),
              perdidos: r.packetsLost,
            };
        });
        window.nimboStats = o;
        document.getElementById('s').textContent = JSON.stringify(o);
      }, 1000);
    })();
  </script>
</body>
