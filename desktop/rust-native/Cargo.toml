[package]
name = "nimbo-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Nimbo native helper in Rust: windows, processes and game watch (no audio). Experimental."

[lib]
name = "nimbo_native"

[[bin]]
name = "nimbo-native"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
