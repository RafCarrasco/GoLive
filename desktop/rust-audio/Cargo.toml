[package]
name = "nimbo-audio"
version = "0.1.0"
edition = "2024"
publish = false
description = "Nimbo game audio capture (WASAPI process loopback). Replaces the C# helper."

[dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant"] }
# Já vem junto com `windows`; a macro `implement` exige o nome `windows_core` visível aqui.
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
